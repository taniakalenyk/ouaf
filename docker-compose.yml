services:
  proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - front
      - back
      - static
    networks:
      - proxy-network

  back:
    image: tetianalombardi/ouaf
    expose:
      - "8080"
    depends_on:
      - db
    volumes:
      - ${PUBLIC_UPLOAD_FOLDER}:/public-upload
      - ${PRIVATE_UPLOAD_FOLDER}:/private-upload
    environment:
      - ${PUBLIC_UPLOAD_FOLDER}:${PUBLIC_UPLOAD_FOLDER}
      - ${PRIVATE_UPLOAD_FOLDER}:${PRIVATE_UPLOAD_FOLDER}
    networks:
      - proxy-network
      - backend-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
    expose:
      - "3306"
    volumes:
      - data:/var/lib/mysql
    networks:
      - backend-network

  static:
    image: nginx:latest
    expose:
      - "80"
    volumes:
      - ${PUBLIC_UPLOAD_FOLDER}:/usr/share/nginx/html/images
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf
    environment:
      - PUBLIC_UPLOAD_FOLDER=${PUBLIC_UPLOAD_FOLDER}
    networks:
      - proxy-network

volumes:
  data:

networks:
  proxy-network:
  backend-network:


